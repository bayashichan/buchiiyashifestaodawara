<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出展申込フォーム</title>
  <meta name="description" content="イベント出展者様向け申込フォームです。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- LIFF SDK（integration.liffId が設定されている場合のみ使用） -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- 送信中オーバーレイ -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <p class="loading-message">送信中です。<br>画面を閉じずにお待ちください...</p>
  </div>

  <!-- 設定読み込み失敗時 -->
  <div id="configError" class="config-error hidden">
    <p>設定の読み込みに失敗しました。</p>
    <button type="button" onclick="location.reload()">再読み込み</button>
  </div>

  <!-- ヘッダー：イベント名・開催日時・会場・早割 -->
  <header id="appHeader" class="app-header">
    <div class="header-inner">
      <img id="headerLogo" class="header-logo hidden" alt="">
      <h1 id="eventTitle">イベント申込フォーム</h1>
      <p class="subtitle">出展申込フォーム</p>

      <div id="eventInfoBox" class="hidden">
        <p id="headerEventDate" class="event-info-badge hidden"></p>
        <p id="headerEventLocation" class="event-location-text hidden"></p>
        <p id="headerEventNote" class="event-note-text hidden"></p>
      </div>

      <div id="earlyBirdBanner" class="hidden">
        <span class="early-bird-badge"></span>
      </div>
    </div>
  </header>

  <!-- 画像差し込み（media[] の position: headerBelow） -->
  <div id="media-headerBelow" class="media-slot"></div>

  <main class="form-container">
    <!-- LINE 連携用の隠しフィールド -->
    <input type="hidden" id="lineUserId">
    <input type="hidden" id="lineDisplayName">

    <!-- リピーター認証（repeater.js が描画） -->
    <section id="repeaterSection" class="repeater-section hidden"></section>

    <form id="applicationForm" novalidate>

      <section class="form-section" data-section="basic">
        <h2 class="section-title"><span class="section-icon">📝</span><span class="section-label"></span></h2>
        <div id="media-sectionTop-basic" class="media-slot"></div>
        <div id="fields-basic" class="field-list"></div>
      </section>

      <section class="form-section" data-section="exhibit">
        <h2 class="section-title"><span class="section-icon">✨</span><span class="section-label"></span></h2>
        <div id="media-sectionTop-exhibit" class="media-slot"></div>
        <div id="fields-exhibit" class="field-list"></div>
      </section>

      <section class="form-section" data-section="sns">
        <h2 class="section-title"><span class="section-icon">🔗</span><span class="section-label"></span></h2>
        <div id="media-sectionTop-sns" class="media-slot"></div>
        <div id="fields-sns" class="field-list"></div>
      </section>

      <!-- オプションは option-renderer.js が描画するので空でも隠さない -->
      <section class="form-section" data-section="options" data-keep-empty>
        <h2 class="section-title"><span class="section-icon">⚙️</span><span class="section-label"></span></h2>
        <div id="media-sectionTop-options" class="media-slot"></div>
        <div id="optionsContainer"></div>
        <div id="fields-options" class="field-list"></div>
      </section>

      <section class="form-section" data-section="terms" data-keep-empty>
        <h2 class="section-title"><span class="section-icon">📋</span><span class="section-label"></span></h2>
        <div id="media-termsAbove" class="media-slot"></div>

        <div class="terms-box" id="termsBox">
          <label class="checkbox-label">
            <input type="checkbox" id="agreeTerms">
            <span>
              <a href="#" id="termsLink" class="terms-link">出展規約</a>
              に同意します<span class="required">*</span>
            </span>
          </label>
          <p class="field-error hidden" id="err_agreeTerms"></p>
        </div>

        <div id="fields-terms" class="field-list"></div>
      </section>

    </form>

    <div id="media-footer" class="media-slot"></div>
  </main>

  <!-- スティッキー料金バー：タップで明細を開閉 -->
  <footer class="price-footer">
    <div id="priceDetails" class="price-details hidden">
      <ul id="priceLineItems" class="price-line-items"></ul>
    </div>
    <div class="price-footer-inner">
      <button type="button" id="priceToggle" class="price-summary" aria-expanded="false">
        <span class="price-summary-label" id="priceSummaryLabel">ブースを選択してください</span>
        <span class="total-price">合計 <span id="totalPrice">¥0</span>
          <span class="price-caret" id="priceCaret">▲</span>
        </span>
      </button>
      <button type="button" id="submitBtn" class="submit-btn">申し込む</button>
    </div>
  </footer>

  <!-- 申込完了 -->
  <div id="completeModal" class="modal-overlay hidden">
    <div class="modal-box" style="text-align:center">
      <div style="font-size:3.5rem;margin-bottom:1rem">🎊</div>
      <h2 class="modal-title">お申込みありがとうございます！</h2>
      <p id="completeMessage" class="modal-text">
        ご登録のメールアドレスに確認メールをお送りしました。<br>内容をご確認ください。
      </p>
      <button type="button" class="submit-btn" style="width:100%" onclick="location.reload()">閉じる</button>
    </div>
  </div>

  <!-- 過去申込の選択（リピーター認証後） -->
  <div id="repeaterSelectModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2 class="modal-title">過去の申込データが見つかりました</h2>
      <p class="modal-text" style="margin-bottom:1rem">読み込むデータを選択してください。</p>
      <div id="repeaterList" class="repeater-list"></div>
      <button type="button" id="closeRepeaterModalBtn" class="secondary-btn">キャンセル</button>
    </div>
  </div>

  <!-- 出展規約 -->
  <div id="termsModal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:640px">
      <h2 class="modal-title" id="termsTitle">出展規約</h2>
      <div id="termsContent" class="terms-content"></div>
      <button type="button" class="submit-btn" style="width:100%" id="closeTermsBtn">閉じる</button>
    </div>
  </div>

  <script src="config-schema.js"></script>
  <script src="form-renderer.js"></script>
  <script src="option-renderer.js"></script>
  <script src="repeater.js"></script>
  <script src="script.js"></script>
</body>
</html>
