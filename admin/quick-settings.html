<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面は移動しました</title>
  <meta name="robots" content="noindex,nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box" style="max-width:460px">
    <h2>管理画面は移動しました</h2>
    <p>
      設定はすべて新しい管理画面にまとまりました。
      早割・ブースの満枠に加えて、料金・オプション・申込項目・メール文面も
      同じ画面から変更できます。
    </p>

    <a class="btn btn-primary btn-block" href="index.html" style="text-decoration:none">
      新しい管理画面を開く
    </a>

    <div class="issue warn" style="margin-top:1.25rem">
      このページはもう使えません。設定ファイルの形式が新しくなったため、
      ここから操作しても保存されません。
    </div>

    <p class="hint" style="margin-top:1rem">
      新しい管理画面はパスワードだけで使えます。GitHub のアカウントやトークンは不要です。
      利用にはイベント主催者の Google アカウントで Apps Script を公開しておく必要があります。
      手順はリポジトリの README をご覧ください。
    </p>
  </div>
</body>
</html>
