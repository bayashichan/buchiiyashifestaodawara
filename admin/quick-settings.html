<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>イベント設定</title>
<link rel="canonical" href="config-editor.html">
<meta http-equiv="refresh" content="3; url=config-editor.html">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", YuGothic, Meiryo, system-ui, sans-serif;
    background: #f6f4f7; color: #2a1a22; line-height: 1.8;
    min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem;
  }
  .box {
    background: #fff; border: 1px solid #e6dfe4; border-radius: .85rem;
    box-shadow: 0 1px 3px rgba(42,26,34,.08), 0 8px 24px rgba(42,26,34,.05);
    padding: 2rem 1.5rem; max-width: 24rem; width: 100%;
    text-align: center; display: flex; flex-direction: column; gap: 1rem;
  }
  h1 { font-size: 1.15rem; color: #650133; }
  p { font-size: .9rem; color: #77636d; }
  a.btn {
    display: block; text-decoration: none;
    background: #650133; color: #fff; font-weight: 700;
    border-radius: 999px; padding: .85rem 1.5rem;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>設定画面はひとつになりました</h1>
    <p>早割・満枠の切り替えを含め、すべての設定を新しい画面で行えます。<br>まもなく自動で移動します。</p>
    <a class="btn" href="config-editor.html">設定画面をひらく</a>
  </div>
</body>
</html>
